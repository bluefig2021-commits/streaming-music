<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 스밍</title>
<style>
:root{--bg:#ffffff;--sf:#f1f1f1;--sf2:#e0e0e0;--tx:#1c1c1c;--mu:#767676;--ac:#4d4d4d;--ac2:#1c1c1c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 84px;grid-template-areas:"side main" "bar bar"}
aside{grid-area:side;background:#f7f7f7;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:22px;margin-bottom:18px;letter-spacing:-.5px}
aside button{background:none;border:0;color:var(--mu);text-align:left;padding:10px 12px;border-radius:8px;font-size:15px;cursor:pointer}
aside button:hover,aside button.on{background:var(--sf);color:var(--tx)}
main{grid-area:main;overflow:auto;padding:24px 28px}
.top{display:flex;gap:10px;margin-bottom:16px}
input{background:var(--sf);border:1px solid var(--sf2);color:var(--tx);padding:12px 16px;border-radius:24px;font-size:15px;outline:none}
input:focus{border-color:var(--ac)}
#q{flex:1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:24px;padding:0 22px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--sf);border:0;color:var(--tx);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px}
.chip:hover{background:var(--sf2)}
h2{font-size:20px;margin-bottom:14px}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--sf)}
.row.cur{background:var(--sf2)}
.row img{width:96px;height:54px;object-fit:cover;border-radius:6px}
.t{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c{font-size:13px;color:var(--mu);margin-top:3px}
.like{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer}
.like.on{color:var(--ac2)}
.msg{color:var(--mu);padding:30px 0;line-height:1.6}
footer{grid-area:bar;background:#f7f7f7;border-top:1px solid var(--sf2);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 20px;gap:16px}
.now{min-width:0}.now .t{-webkit-line-clamp:1}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl .b{display:flex;gap:14px;align-items:center}
.ctl button{background:none;border:0;color:var(--tx);font-size:20px;cursor:pointer}
.ctl .play{background:var(--tx);color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px}
.seek{display:flex;gap:8px;align-items:center;width:100%;font-size:12px;color:var(--mu)}
.seek input[type=range],.vol input{padding:0;border:0;background:none;accent-color:var(--ac);width:100%}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}.vol input{width:100px}
#pw{position:fixed;right:16px;bottom:100px;width:320px;height:180px;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px #0003;background:#000;z-index:5}
#pw.hide{display:none}
#setup{max-width:480px;background:var(--sf);padding:22px;border-radius:14px;line-height:1.6;font-size:14px;color:var(--mu)}
#setup input{width:100%;margin:12px 0}
.chip{cursor:pointer}.chip b{margin-left:8px;color:var(--mu)}.chip b:hover{color:var(--tx)}.row .rd{opacity:0}.row:hover .rd{opacity:1}.chip .ac{display:none}.chip:hover .ac{display:inline}.mini{padding:7px 14px;font-size:14px;width:130px}
.sg{background:#fff;border:1px solid var(--sf2)}.sg:hover{background:var(--sf)}.sg.done{opacity:.4;pointer-events:none}
#gate{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;line-height:1.6}#gate.off{display:none}#gate .btn{height:46px;font-size:15px}#gm{color:var(--mu);font-size:14px;max-width:420px;word-break:break-all}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-areas:"main" "bar"}aside{display:none}footer{grid-template-columns:1fr}.vol{display:none}#pw{width:200px;height:112px}}
</style>
</head>
<body>
<div id="gate"><h1>내 스밍</h1><button class="btn" id="gl">구글로 로그인</button><div id="gm"></div></div>
<aside>
  <h1>내 스밍</h1>
  <button class="on" data-v="home">검색 / 홈</button>
  <button data-v="rec">나를 위한 추천</button>
  <button data-v="gen">장르 추천</button>
  <button data-v="loc">내 MP3</button>
  <button data-v="likes">좋아요</button>
  <button data-v="dis">싫어하는 장르</button>
  <button data-v="key">API 키 설정</button>
  <button data-v="out" style="margin-top:auto">로그아웃</button>
</aside>
<main>
  <div class="top">
    <input id="q" placeholder="노래, 아티스트, 팟캐스트, ASMR 검색">
    <button class="btn" id="go">검색</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="view"></div>
</main>
<footer>
  <div class="now"><div class="t" id="nt">재생 중인 곡 없음</div><div class="c" id="nc"></div></div>
  <div class="ctl">
    <div class="b"><button id="prev">⏮</button><button class="play" id="pp">▶</button><button id="next">⏭</button></div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="vol">🔊<input type="range" id="vl" min="0" max="100" value="70"></div>
</footer>
<div id="pw" class="hide"><div id="yt"></div></div>
<input type="file" id="fi" accept="audio/*,.mp3" multiple hidden>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAtfbH5Pv49sYNCFUSgG6LXoF680X0cw2g",authDomain:"streaming-music-dfe0e.firebaseapp.com",projectId:"streaming-music-dfe0e",storageBucket:"streaming-music-dfe0e.firebasestorage.app",messagingSenderId:"280658811787",appId:"1:280658811787:web:96a93e8147fb9e32ea6d8e"};
const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp),db=getFirestore(fbApp);
let uid=null,saveT;
function scheduleSave(){if(!uid)return;clearTimeout(saveT);saveT=setTimeout(()=>setDoc(doc(db,'users',uid),{ytKey:key,likes,hist,genres,dislikes},{merge:true}).catch(()=>{}),800)}
const $=s=>document.querySelector(s);
const store={set(){scheduleSave()}};
const DEF=['로파이','ASMR','팟캐스트','재즈','집중 음악'];
let key='', likes=[], hist=[], genres=[...DEF], dislikes=[], local=[];
let list=[], idx=-1, player, ready=false, timer;
const au=new Audio();au.volume=.7;
const NOTE='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="54"><rect width="96" height="54" fill="#e0e0e0"/><text x="48" y="37" font-size="28" text-anchor="middle">🎵</text></svg>');
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isL=()=>list[idx]&&list[idx].local;

// MP3 저장 (이 브라우저 IndexedDB)
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('mysm',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function dbPut(o){const d=await idb();if(d)d.transaction('f','readwrite').objectStore('f').put({id:o.id,title:o.title,blob:o.blob})}
async function dbDel(id){const d=await idb();if(d)d.transaction('f','readwrite').objectStore('f').delete(id)}
async function dbAll(){const d=await idb();if(!d)return[];return new Promise(r=>{const q=d.transaction('f').objectStore('f').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
const mk=o=>({id:o.id,title:o.title,ch:'내 MP3',th:NOTE,local:true,blob:o.blob});

function renderChips(){
  $('#chips').innerHTML=genres.map((c,i)=>`<span class="chip"><span data-g="${i}">${esc(c)}</span><b class="ac" data-e="${i}">✎</b><b class="ac" data-x="${i}">×</b></span>`).join('')+'<span class="chip" id="addg" style="color:var(--mu)">+</span>';
}
$('#chips').onclick=e=>{const g=e.target.dataset.g,x=e.target.dataset.x,ed=e.target.dataset.e;
  if(e.target.id==='addg'){e.target.outerHTML='<input id="ng" class="mini" placeholder="장르 입력 후 엔터">';$('#ng').focus();return}
  if(ed!==undefined){const n=prompt('장르 이름 수정',genres[+ed]);if(n&&n.trim()){genres[+ed]=n.trim();store.set();renderChips()}return}
  if(x!==undefined){genres.splice(+x,1);store.set();renderChips()}
  else if(g!==undefined){const n=genres[+g];$('#q').value=n;search(n)}};
$('#chips').onkeydown=e=>{if(e.target.id==='ng'&&e.key==='Enter'&&e.target.value.trim()){genres.push(e.target.value.trim());store.set();renderChips();$('#ng').focus()}};
renderChips();
$('#chips').addEventListener('focusout',e=>{if(e.target.id==='ng'&&!e.target.value.trim())renderChips()});
$('#go').onclick=()=>search($('#q').value);
$('#q').onkeydown=e=>{if(e.key==='Enter')search($('#q').value)};
document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('aside button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const v=b.dataset.v;
  if(v==='home')home();else if(v==='rec')recommend();else if(v==='gen')genreView();else if(v==='loc')showLocal();else if(v==='likes')showLikes();else if(v==='out')signOut(auth);else if(v==='dis')dislikeView();else setup();
});

function setup(){
  $('#view').innerHTML=`<div id="setup"><b style="color:var(--tx);font-size:16px">YouTube API 키</b><br>구글 클라우드 콘솔에서 YouTube Data API v3 켜고 키 발급받아서 붙여넣기. 키는 네 계정 전용 문서에 저장됨.<input id="ki" type="password" placeholder="AIza..." value="${esc(key)}"><button class="btn" style="height:40px" id="ks">저장</button></div>`;
  $('#ks').onclick=()=>{key=$('#ki').value.trim();store.set('yt_key',key);home()};
}
function dislikeView(){
  $('#view').innerHTML=`<h2>싫어하는 장르</h2><div class="msg" style="padding-top:0">여기 넣은 단어는 검색할 때 자동으로 빠짐. 완벽하게 걸러지진 않음.</div><div class="chips">${dislikes.map((c,i)=>`<span class="chip">${esc(c)}<b class="ac" data-d="${i}">×</b></span>`).join('')}<input id="nd" class="mini" placeholder="+ 추가"></div>`;
}
$('#view').onkeydown=e=>{if(e.target.id==='nd'&&e.key==='Enter'&&e.target.value.trim()){dislikes.push(e.target.value.trim());store.set();dislikeView();$('#nd').focus()}};
function home(){
  $('#view').innerHTML=key?'<div class="msg">위에서 검색하거나 칩 눌러봐. 곡 좋아요 누르면 추천 탭이 취향 따라 바뀜.</div>':'';
  if(!key)setup();
}
async function search(q,label){
  if(!q.trim())return;
  if(!key){setup();return}
  $('#view').innerHTML='<div class="msg">찾는 중...</div>';
  try{
    list=await fetchList(q);
    idx=-1;render(label||`"${q}" 결과`);
  }catch(e){$('#view').innerHTML=`<div class="msg">에러: ${esc(e.message||'네트워크 문제')}<br>키가 맞는지, YouTube Data API v3가 켜져 있는지 확인해봐. 하루 할당량 넘었을 수도 있음.</div>`}
}
let curTitle='';
function render(title){
  curTitle=title;
  $('#view').innerHTML=`<h2>${esc(title)}</h2>`+(list.length?list.map((s,i)=>`<div class="row ${i===idx?'cur':''}" data-i="${i}"><img src="${s.th}" alt=""><div><div class="t">${esc(s.title)}</div><div class="c">${esc(s.ch)}</div></div><span>${s.local?`<button class="like rd" data-del="${i}" title="삭제">🗑</button>`:`<button class="like rd" data-r="${i}" title="이 곡 기반 라디오">📻</button><button class="like ${likes.some(l=>l.id===s.id)?'on':''}" data-l="${i}">♥</button>`}</span></div>`).join(''):'<div class="msg">아직 없음</div>');
}
$('#view').onclick=e=>{
  const ag=e.target.dataset.ag;if(ag!==undefined){const n=ag;if(!genres.includes(n)){genres.push(n);store.set();renderChips()}e.target.classList.add('done');return}
  if(e.target.id==='again'){genreView();return}
  if(e.target.id==='up'){$('#fi').click();return}
  const dl=e.target.closest('[data-del]');if(dl){const s=list[+dl.dataset.del];local=local.filter(x=>x.id!==s.id);dbDel(s.id);if(isL()&&list[idx].id===s.id){au.pause()}showLocal();return}
  const rb=e.target.closest('[data-r]');if(rb){radio(+rb.dataset.r);return}
  const dd=e.target.dataset.d;if(dd!==undefined){dislikes.splice(+dd,1);store.set();dislikeView();return}
  const l=e.target.closest('[data-l]');
  if(l){const s=list[+l.dataset.l];const k=likes.findIndex(x=>x.id===s.id);k>=0?likes.splice(k,1):likes.push(s);store.set();l.classList.toggle('on');return}
  const r=e.target.closest('.row');if(r)play(+r.dataset.i);
};
function showLikes(){list=[...likes];idx=-1;render('좋아요 한 곡')}

// 내 MP3
function showLocal(){
  list=[...local];idx=-1;render('내 MP3');
  $('#view').querySelector('h2').insertAdjacentHTML('afterend','<div style="margin-bottom:14px"><button class="btn" style="height:40px" id="up">+ MP3 추가</button><span class="msg" style="padding-left:12px;font-size:13px">이 브라우저에만 저장돼. 다른 기기에선 다시 올려야 함.</span></div>');
}
$('#fi').onchange=async e=>{
  for(const f of e.target.files){
    const id='l_'+f.name+'_'+f.size;if(local.some(x=>x.id===id))continue;
    const o={id,title:f.name.replace(/\.[^.]+$/,''),blob:f};local.push(mk(o));dbPut(o);
  }
  e.target.value='';showLocal();
};

// 장르 추천 (내 좋아요/들은 곡 분석)
const KO={Pop_music:'팝',Hip_hop_music:'힙합',Rock_music:'록',Electronic_music:'일렉트로닉',Classical_music:'클래식',Jazz:'재즈',Independent_music:'인디',Soul_music:'소울',Rhythm_and_blues:'R&B',Country_music:'컨트리',Reggae:'레게',Blues:'블루스',Music_of_Asia:'K-pop 아시아 음악',Music_of_Latin_America:'라틴 음악',Folk_music:'포크',Heavy_metal_music:'메탈',Christian_music:'CCM',Music_of_Africa:'아프로 음악',Techno:'테크노',House_music:'하우스',Ambient_music:'앰비언트',Disco:'디스코',Funk:'펑크',Pop_rock:'팝록'};
const POOL=['시티팝','발라드','인디 포크','R&B 감성','K-pop 명곡','어쿠스틱','뉴에이지','로파이 힙합','재즈 카페','드라이브 노래','새벽 감성','피아노 연주','밴드 사운드','90년대 가요','2000년대 가요','OST','보사노바','잔잔한 팝송','공부할 때 듣는 음악','숲 ASMR'];
async function genreView(){
  $('#view').innerHTML='<div class="msg">취향 분석 중...</div>';
  let found=[];
  const ids=[...new Set([...likes,...hist.slice(-30)].map(s=>s.id))].slice(-50);
  if(key&&ids.length){
    try{
      const d=await (await fetch(`https://www.googleapis.com/youtube/v3/videos?part=topicDetails&id=${ids.join(',')}&key=${encodeURIComponent(key)}`)).json();
      const cnt={};
      (d.items||[]).forEach(v=>((v.topicDetails||{}).topicCategories||[]).forEach(u=>{const k=u.split('/').pop();if(KO[k])cnt[KO[k]]=(cnt[KO[k]]||0)+1}));
      found=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    }catch(e){}
  }
  const rest=POOL.filter(x=>!genres.includes(x)).sort(()=>Math.random()-.5).slice(0,8);
  const chip=g=>`<span class="chip sg ${genres.includes(g)?'done':''}" data-ag="${esc(g)}">+ ${esc(g)}</span>`;
  $('#view').innerHTML=`<h2>장르 추천</h2>`+
   (found.length?`<div class="msg" style="padding:0 0 10px">내가 듣고 좋아요 한 곡 분석 결과 많이 나온 장르</div><div class="chips">${found.slice(0,6).map(chip).join('')}</div>`:`<div class="msg" style="padding:0 0 10px">아직 분석할 취향 데이터가 부족해. 곡 좀 듣고 좋아요 누르면 내 취향 장르가 여기 뜸.</div>`)+
   `<div class="msg" style="padding:0 0 10px">이런 장르는 어때?</div><div class="chips">${rest.map(chip).join('')}</div><button class="btn" style="height:40px" id="again">다른 추천 보기</button>`;
}

const junk=/official|video|\bmv\b|m\/v|audio|lyrics?|\blive\b|\bhd\b|4k|가사|공식|뮤직비디오|(ft|feat)\.?.*/gi;
const strip=t=>t.replace(/[\[\(【].*?[\]\)】]/g,' ');
function cleanTitle(t){return strip(t).replace(junk,' ').replace(/\s+/g,' ').trim()}
function artistOf(s){
  let a=s.title.includes(' - ')?s.title.split(' - ')[0]:s.ch;
  a=strip(a).replace(/vevo|official|공식|- topic|records?|entertainment/gi,' ').replace(/\s+/g,' ').trim();
  return a||cleanTitle(s.title);
}
async function fetchList(q){
  const full=q+' '+dislikes.map(d=>'-'+d.replace(/\s+/g,'')).join(' ');
  const u=`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&videoSyndicated=true&maxResults=25&q=${encodeURIComponent(full)}&key=${encodeURIComponent(key)}`;
  const d=await (await fetch(u)).json();
  if(d.error)throw new Error(d.error.message);
  return d.items.map(i=>({id:i.id.videoId,title:dec(i.snippet.title),ch:dec(i.snippet.channelTitle),th:i.snippet.thumbnails.medium.url}));
}
async function radio(i){
  const seed=list[i];if(!seed||!key)return;
  $('#view').innerHTML='<div class="msg">라디오 만드는 중...</div>';
  try{
    const r=(await fetchList(artistOf(seed)+' 노래 모음')).filter(x=>x.id!==seed.id);
    list=[seed,...r];idx=-1;render('📻 '+cleanTitle(seed.title)+' 라디오');play(0);
  }catch(e){$('#view').innerHTML=`<div class="msg">에러: ${esc(e.message)}</div>`}
}
let extending=false,pending=false;
async function extend(go){
  if(extending){if(go)pending=true;return}
  extending=true;
  const seed=list[idx];
  try{
    const have=new Set(list.map(x=>x.id));hist.forEach(h=>have.add(h.id));
    const r=(await fetchList(artistOf(seed)+' 노래 모음')).filter(x=>!have.has(x.id));
    if(!r.length)throw 0;
    list=list.concat(r);
    if($('#view').querySelector('.row')){const m=document.querySelector('main'),t=m.scrollTop;render(curTitle);m.scrollTop=t}
    if(go)play(idx+1);
  }catch(e){if(go)play(0)}
  finally{
    extending=false;
    if(pending){pending=false;play(idx<list.length-1?idx+1:0)}
  }
}
function recommend(){
  const seeds=[...likes,...hist.slice(-20)];
  const useArtist=seeds.length&&(!genres.length||Math.random()<.6);
  $('#q').value='';
  if(useArtist){
    const a=artistOf(seeds[Math.floor(Math.random()*seeds.length)]);
    search(a+' 노래 모음',a+' 같은 느낌의 추천');
  }else if(genres.length){
    const g=genres[Math.floor(Math.random()*genres.length)];
    search(g+' 플레이리스트',g+' 추천');
  }else $('#view').innerHTML='<div class="msg">아직 취향 데이터가 없음. 장르를 추가하거나 곡에 좋아요를 눌러봐.</div>';
}

// player
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('yt',{width:320,height:180,playerVars:{playsinline:1,rel:0,modestbranding:1},events:{
    onReady:()=>{ready=true;player.setVolume(+$('#vl').value)},
    onStateChange:e=>{
      if(isL())return;
      $('#pp').textContent=e.data===1?'⏸':'▶';
      if(e.data===0)next();
      clearInterval(timer);
      if(e.data===1)timer=setInterval(tick,500);
    },
    onError:()=>next()
  }});
};
au.onplay=()=>{if(isL())$('#pp').textContent='⏸'};
au.onpause=()=>{if(isL())$('#pp').textContent='▶'};
au.onended=()=>next();
au.ontimeupdate=()=>{if(isL())tick()};
function play(i){
  const s=list[i];if(!s)return;
  if(!s.local&&!ready)return;
  idx=i;
  $('#nt').textContent=s.title;$('#nc').textContent=s.ch;
  if(s.local){
    clearInterval(timer);if(ready)player.pauseVideo();
    $('#pw').classList.add('hide');
    if(!s.url)s.url=URL.createObjectURL(s.blob);
    au.src=s.url;au.play();
  }else{
    au.pause();
    if(key&&i>=list.length-2)extend(false);
    $('#pw').classList.remove('hide');
    player.loadVideoById(s.id);
    hist.push(s);hist=hist.slice(-60);store.set();
  }
  document.querySelectorAll('.row').forEach((r,n)=>r.classList.toggle('cur',n===i));
}
const next=()=>{if(!list.length)return;if(idx>=list.length-1&&key&&!isL())extend(true);else play(isL()?(idx+1)%list.length:idx+1)};
const prev=()=>{if(list.length)play((idx-1+list.length)%list.length)};
function tick(){
  let d,c;
  if(isL()){d=au.duration;c=au.currentTime}
  else{if(!player||!player.getDuration)return;d=player.getDuration();c=player.getCurrentTime()}
  $('#cur').textContent=fmt(c);$('#dur').textContent=fmt(d);
  if(!seeking&&d)$('#sk').value=c/d*1000;
}
let seeking=false;
$('#sk').oninput=()=>{seeking=true};
$('#sk').onchange=()=>{const v=$('#sk').value/1000;if(isL()){if(au.duration)au.currentTime=v*au.duration}else player.seekTo(v*player.getDuration(),true);seeking=false};
$('#pp').onclick=()=>{
  if(idx<0&&list.length){play(0);return}
  if(isL()){au.paused?au.play():au.pause();return}
  if(!ready)return;player.getPlayerState()===1?player.pauseVideo():player.playVideo()};
$('#next').onclick=next;$('#prev').onclick=prev;
$('#vl').oninput=()=>{au.volume=+$('#vl').value/100;ready&&player.setVolume(+$('#vl').value)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;if(e.code==='Space'){e.preventDefault();$('#pp').click()}});
const gate=(on,m)=>{$('#gate').classList.toggle('off',!on);$('#gm').textContent=m||''};
$('#gl').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>gate(true,'로그인 실패: '+e.code));
onAuthStateChanged(auth,async u=>{
  if(!u){uid=null;gate(true,'');return}
  try{
    const sn=await getDoc(doc(db,'users',u.uid));
    uid=u.uid;const d=sn.exists()?sn.data():{};
    key=d.ytKey||'';likes=d.likes||[];hist=d.hist||[];genres=d.genres||[...DEF];dislikes=d.dislikes||[];renderChips();
    dbAll().then(a=>{local=a.map(mk)});
    gate(false);home();
  }catch(e){gate(true,'접근 권한 없음. 이 UID를 파이어스토어 규칙에 넣어: '+u.uid)}
});
</script>
</body>
